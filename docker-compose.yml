name: agentmesh

services:
  gateway:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      GROQ_BASE_URL: "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
      KNOWLEDGE_BASE_PATH: /app/data/product_docs.json
      RETRIEVAL_MIN_SCORE: "${RETRIEVAL_MIN_SCORE:-0.18}"
      DATABASE_PATH: /app/state/agentmesh.db
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      QUERY_MAX_LENGTH: "${QUERY_MAX_LENGTH:-4000}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-30}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      AGENT_TIMEOUT_SECONDS: "${AGENT_TIMEOUT_SECONDS:-15}"
      BLOCKCHAIN_ENABLED: "${BLOCKCHAIN_ENABLED:-false}"
      BLOCKCHAIN_RPC_URL: "${BLOCKCHAIN_RPC_URL:-}"
      BLOCKCHAIN_CONTRACT_ADDRESS: "${BLOCKCHAIN_CONTRACT_ADDRESS:-}"
      BLOCKCHAIN_WALLET_ADDRESS: "${BLOCKCHAIN_WALLET_ADDRESS:-}"
      BLOCKCHAIN_PRIVATE_KEY: "${BLOCKCHAIN_PRIVATE_KEY:-}"
      BLOCKCHAIN_EXPLORER_URL: "${BLOCKCHAIN_EXPLORER_URL:-}"
      BLOCKCHAIN_NETWORK: "${BLOCKCHAIN_NETWORK:-local}"
      BLOCKCHAIN_RECEIPT_TIMEOUT: "${BLOCKCHAIN_RECEIPT_TIMEOUT:-30}"
      REVIEW_API_KEY: "${REVIEW_API_KEY:-local-review-key-change-me}"
    volumes:
      - agentmesh_state:/app/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  agentmesh_state:

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ""
      GROQ_MODEL: llama-3.3-70b-versatile
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      KNOWLEDGE_BASE_PATH: data/product_docs.json
      DATABASE_PATH: /tmp/agentmesh-ci.db
      CORS_ORIGINS: http://localhost:3000
      QUERY_MAX_LENGTH: "4000"
      RATE_LIMIT_REQUESTS: "1000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      BLOCKCHAIN_ENABLED: "false"
      REVIEW_API_KEY: ci-review-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall agents api consensus shared evaluation

      - name: Lint Python sources
        run: python -m ruff check agents api consensus shared evaluation tests

      - name: Run backend tests
        run: python -m pytest -v

      - name: Run deterministic evaluation
        run: python evaluation/run_evaluation.py --no-write

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Install blockchain test dependencies
        working-directory: blockchain
        run: npm ci --no-audit --no-fund

      - name: Compile and test optional audit contract
        working-directory: blockchain
        run: npm test

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
